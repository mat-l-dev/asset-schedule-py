[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-schedule-py"
version = "0.1.0"
description = "Deterministic monthly straight-line depreciation in integer minor units."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
keywords = ["depreciation", "assets", "schedule", "integer-arithmetic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.scripts]
asset-schedule = "asset_schedule.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asset_schedule = ["py.typed"]
